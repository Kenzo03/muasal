version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "halfvec"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
          - db_type: "halfvec"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "HalfVector"
              pointer: true
            nullable: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
