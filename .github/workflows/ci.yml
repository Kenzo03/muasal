name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U owner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://owner:owner@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: server/go.sum
      - run: go generate ./...
      - name: Generated Go code is up to date
        run: git diff --exit-code
      - run: go vet ./...
      - name: Licences of Go dependencies
        run: go run ./cmd/licenses
      - name: Known vulnerabilities in Go dependencies
        run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: go test
        # Failing tests become annotations on the check run, readable without the log.
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || { grep -E -- '--- FAIL|_test\.go:[0-9]+:' test.log | head -50 | sed 's/^/::error::/'; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: Generated API types are up to date
        run: git diff --exit-code
      - run: npm run check:i18n
      - run: npm run check:licenses
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build --wait
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env logs
