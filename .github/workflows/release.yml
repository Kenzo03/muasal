name: release
# A tag such as v1.2.0 publishes the release (FSD §22, Launch): app and web
# images for linux/amd64 and linux/arm64 on GHCR with SBOM and provenance,
# signed with Sigstore keyless signing; the offline bundle (amd64) and the
# deploy files for online installs, with checksums and signatures.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  packages: write # GHCR
  id-token: write # Sigstore keyless signing

jobs:
  # Each image is built on a runner of its own architecture. Emulating arm64
  # with QEMU hung the web build (Next.js) until the 6-hour limit cut it off.
  images:
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        component: [app, web]
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Names
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muasal-${{ matrix.component }}" >>"$GITHUB_OUTPUT"
          echo "context=${{ matrix.component == 'app' && 'server' || 'web' }}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ steps.names.outputs.context }}
          platforms: linux/${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Keep the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform }}
          path: digests/*
          retention-days: 1

  # One multi-arch tag per component from the per-platform digests, then signed.
  manifests:
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 15
    strategy:
      matrix:
        component: [app, web]
    steps:
      - name: Names
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muasal-${{ matrix.component }}" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: digests
        run: |
          image=${{ steps.names.outputs.image }}
          docker buildx imagetools create -t "$image:${{ steps.names.outputs.version }}" -t "$image:latest"             $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:${{ steps.names.outputs.version }}"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: |
          image=${{ steps.names.outputs.image }}
          digest=$(docker buildx imagetools inspect "$image:${{ steps.names.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$image@$digest"

  release:
    runs-on: ubuntu-latest
    needs: manifests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - name: Offline bundle and deploy files
        run: |
          version=${GITHUB_REF_NAME#v}
          prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/muasal
          for c in app web; do
            docker pull --platform linux/amd64 "$prefix-$c:$version"
            docker tag "$prefix-$c:$version" "muasal-$c:$version"
          done
          deploy/make-bundle.sh "$version"
          mkdir -p "dist/muasal-deploy-$version"
          grep -v '^    build: ' deploy/compose.yaml >"dist/muasal-deploy-$version/compose.yaml"
          cp deploy/compose.host-ai.yaml deploy/Caddyfile deploy/.env.example deploy/install.sh deploy/upgrade.sh \
            deploy/backup.sh deploy/restore.sh "dist/muasal-deploy-$version/"
          cp docs/operations.md "dist/muasal-deploy-$version/README.md"
          echo "$version" >"dist/muasal-deploy-$version/VERSION"
          tar -C dist -czf "dist/muasal-deploy-$version.tar.gz" "muasal-deploy-$version"
          cd dist
          sha256sum "muasal-$version.tar" "muasal-deploy-$version.tar.gz" >SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --title "Muasal $version" --generate-notes \
            "dist/muasal-$version.tar" "dist/muasal-deploy-$version.tar.gz" dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
