openapi: 3.0.3
info:
  title: Muasal API
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in; the `sid` session cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Signed out; the session is revoked. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/setup:
    post:
      operationId: setupPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Password set; every session of the user is revoked. }
        default: { $ref: "#/components/responses/Problem" }
  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: The user, with a one-time setup link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedUser" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users/{id}/setup-link:
    post:
      operationId: createSetupLink
      tags: [admin]
      description: Resets the password; the old one stops working and every session ends.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201":
          description: A new one-time setup link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupLink" }
        default: { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: The projects the user belongs to; system admins see every project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      tags: [projects]
      description: System admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: The new project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      description: Members only; everyone else gets 404.
      responses:
        "200":
          description: The project and the caller's role in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      tags: [projects]
      description: Project admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/clients:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectClients
      tags: [projects]
      description: Every member; members see only the clients in their scope.
      responses:
        "200":
          description: The clients linked to the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setProjectClients
      tags: [projects]
      description: Project admins only. Replaces the linked clients; removing one that menus or member scopes use answers 409 client_in_use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectClientsUpdate" }
      responses:
        "200":
          description: The clients now linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      description: System admins and project admins.
      responses:
        "200":
          description: Every client, archived ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      tags: [clients]
      description: System admins and project admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreate" }
      responses:
        "201":
          description: The new client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        default: { $ref: "#/components/responses/Problem" }
  /clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateClient
      tags: [clients]
      description: System admins only. An empty code clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: The updated client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/members:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectMembers
      tags: [projects]
      description: Project admins only.
      responses:
        "200":
          description: The project's members and their client scopes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setProjectMembers
      tags: [projects]
      description: Project admins only. Replaces every membership of the project at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembersUpdate" }
      responses:
        "200":
          description: The members now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      description: Contacts of clients in the caller's scope plus internal contacts, at most 50, for type-ahead.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: client_id, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Matching contacts, by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createContact
      tags: [contacts]
      description: Members and project admins, for clients in their scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: The new contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        default: { $ref: "#/components/responses/Problem" }
  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateContact
      tags: [contacts]
      description: Replaces every field; an omitted client_id makes the contact internal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/nodes:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listNodes
      tags: [nodes]
      description: The tree as a flat list. Client-specific menus outside the caller's scope, and what is under them, are left out.
      responses:
        "200":
          description: Live nodes; siblings in position order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createNode
      tags: [nodes]
      description: Project admins only. The node goes last among its siblings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeCreate" }
      responses:
        "201":
          description: The new node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateNode
      tags: [nodes]
      description: Project admins only. Edits fields, and moves the node when `move` is present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdate" }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteNode
      tags: [nodes]
      description: Project admins only. A node with sub-nodes answers 409 node_has_children.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/statuses:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStatuses
      tags: [projects]
      description: Every member; the board, the list and the ticket page need them.
      responses:
        "200":
          description: The project's statuses in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setStatuses
      tags: [projects]
      description: Project admins only. Replaces the ordered list; tickets of a removed status move as `move_to` says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusesUpdate" }
      responses:
        "200":
          description: The statuses now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/assignees:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAssignees
      tags: [projects]
      description: Members who can own tickets (not viewers).
      responses:
        "200":
          description: Assignable members by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/tickets:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: createTicket
      tags: [tickets]
      description: Members and project admins. The ticket starts in the default status unless an open status_id is given.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201":
          description: The new ticket; ETag carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, example: HRIS-231 } }
    get:
      operationId: getTicket
      tags: [tickets]
      responses:
        "200":
          description: The ticket; ETag carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateTicket
      tags: [tickets]
      description: Members and project admins. Replaces every editable field; a stale If-Match answers 412.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"7"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdate" }
      responses:
        "200":
          description: The updated ticket; ETag carries its new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/transition:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: transitionTicket
      tags: [tickets]
      description: Members and project admins. Moves among open statuses; closing answers 422 close_unavailable until the close dialog ships.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: The ticket in its new status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Locale:
      type: string
      enum: [id, en]
    User:
      type: object
      required: [id, email, name, is_admin, locale, timezone, disabled, has_password, created_at, last_login_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string, example: Asia/Jakarta }
        disabled: { type: boolean }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 320 }
        password: { type: string, maxLength: 1024 }
    SetupRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, maxLength: 1024 }
    MeUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, maxLength: 1024 }
    UserCreate:
      type: object
      required: [email, name]
      properties:
        email: { type: string, maxLength: 320 }
        name: { type: string, maxLength: 200 }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
    UserUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        disabled: { type: boolean }
    SetupLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
    CreatedUser:
      type: object
      required: [user, setup_link]
      properties:
        user: { $ref: "#/components/schemas/User" }
        setup_link: { $ref: "#/components/schemas/SetupLink" }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ProjectRole:
      type: string
      enum: [admin, member, viewer]
    Project:
      type: object
      required: [id, key, name, description, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: HRIS }
        name: { type: string }
        description: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        created_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key: { type: string, maxLength: 10, description: "2–10 capital letters or digits, starting with a letter; lower case is accepted" }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    ProjectUpdate:
      type: object
      properties:
        key: { type: string, maxLength: 10 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    Client:
      type: object
      required: [id, name, code, aliases, archived]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string, nullable: true, example: CLA }
        aliases:
          type: array
          items: { type: string }
        archived: { type: boolean }
    ClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Client" }
    ClientCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 20 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 20 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        archived: { type: boolean }
    ProjectClientsUpdate:
      type: object
      required: [client_ids]
      properties:
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    Member:
      type: object
      required: [user_id, name, email, role, all_clients, client_ids]
      properties:
        user_id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        all_clients: { type: boolean }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberInput:
      type: object
      required: [email, role, all_clients]
      properties:
        email: { type: string, maxLength: 320 }
        role: { $ref: "#/components/schemas/ProjectRole" }
        all_clients: { type: boolean, description: Project admins always have all clients. }
        client_ids:
          type: array
          description: The clients a scoped member sees; ignored with all_clients.
          items: { type: integer, format: int64 }
    MembersUpdate:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberInput" }
    Contact:
      type: object
      required: [id, client_id, client_name, name, title, email, phone]
      properties:
        id: { type: integer, format: int64 }
        client_id: { type: integer, format: int64, nullable: true }
        client_name: { type: string, nullable: true }
        name: { type: string }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    ContactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
    ContactInput:
      type: object
      required: [name]
      properties:
        client_id: { type: integer, format: int64, description: Omitted for internal people. }
        name: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        phone: { type: string, maxLength: 50 }
    NodeType:
      type: string
      enum: [module, menu]
    NodeClient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Node:
      type: object
      required: [id, parent_id, type, name, code, aliases, description, client_specific, clients, position]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, nullable: true }
        type: { $ref: "#/components/schemas/NodeType" }
        name: { type: string }
        code: { type: string, nullable: true, example: HR.ATT.OT_APPROVAL }
        aliases:
          type: array
          items: { type: string }
        description: { type: string }
        client_specific: { type: boolean }
        clients:
          type: array
          description: The node's clients within the caller's scope.
          items: { $ref: "#/components/schemas/NodeClient" }
        position: { type: integer, format: int32 }
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Node" }
    NodeCreate:
      type: object
      required: [type, name]
      properties:
        parent_id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/NodeType" }
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 100 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        client_specific: { type: boolean }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    NodeUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        type: { $ref: "#/components/schemas/NodeType" }
        code: { type: string, maxLength: 100, description: An empty code clears it. }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        client_specific: { type: boolean, description: When present, client_ids replaces the node's clients. }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
        move: { $ref: "#/components/schemas/NodeMove" }
    NodeMove:
      type: object
      properties:
        parent_id: { type: integer, format: int64, nullable: true, description: Omitted or null moves to the top level. }
        position: { type: integer, format: int32, minimum: 0, description: Index among the new siblings; omitted puts the node last. }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    RefList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ref" }
    StatusCategory:
      type: string
      enum: [todo, in_progress, done, cancelled]
    Status:
      type: object
      required: [id, name, category, color, position, is_default]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { $ref: "#/components/schemas/StatusCategory" }
        color: { type: string, example: "#2563EB" }
        position: { type: integer, format: int32 }
        is_default: { type: boolean }
    StatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Status" }
    StatusInput:
      type: object
      required: [name, category, color]
      properties:
        id: { type: integer, format: int64, description: An existing status; omitted adds one. }
        name: { type: string, maxLength: 50 }
        category: { $ref: "#/components/schemas/StatusCategory" }
        color: { type: string, example: "#2563EB" }
        is_default: { type: boolean }
    StatusMove:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, format: int64, description: A removed status. }
        to: { type: integer, format: int64, description: A kept status of the same open or closed kind. }
    StatusesUpdate:
      type: object
      required: [statuses]
      properties:
        statuses:
          type: array
          items: { $ref: "#/components/schemas/StatusInput" }
        move_to:
          type: array
          items: { $ref: "#/components/schemas/StatusMove" }
    TicketType:
      type: string
      enum: [bug, change_request, feature]
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    TicketRequester:
      type: object
      required: [kind, id, name, title]
      properties:
        kind: { type: string, enum: [contact, user] }
        id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string, nullable: true, example: HR Manager }
    NodeRef:
      type: object
      required: [id, name, archived]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        archived: { type: boolean }
    Attachment:
      type: object
      required: [id, filename, content_type, size_bytes, uploader, created_at]
      properties:
        id: { type: integer, format: int64 }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        uploader: { $ref: "#/components/schemas/Ref" }
        created_at: { type: string, format: date-time }
    Ticket:
      type: object
      required: [id, key, project_key, title, type, description, reason, status, requester, reporter, priority, due_date, nodes, attachments, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: HRIS-231 }
        project_key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        description: { type: string }
        reason: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/TicketRequester" }
        reporter: { $ref: "#/components/schemas/Ref" }
        assignee: { $ref: "#/components/schemas/Ref" }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NodeRef" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [type, title, node_ids]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        title: { type: string, maxLength: 200 }
        client_id: { type: integer, format: int64, description: Omitted for core work (all clients). }
        requester_contact_id: { type: integer, format: int64 }
        requester_user_id: { type: integer, format: int64, description: Without a requester the reporter is the requester. }
        node_ids:
          type: array
          items: { type: integer, format: int64 }
        reason: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 50000 }
        assignee_id: { type: integer, format: int64 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        status_id: { type: integer, format: int64, description: An open status; omitted means the project's default. }
    TicketUpdate:
      type: object
      description: Replaces every editable field; send the current value of each field you keep.
      required: [type, title, node_ids]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        title: { type: string, maxLength: 200 }
        client_id: { type: integer, format: int64, description: Omitted for core work (all clients). }
        requester_contact_id: { type: integer, format: int64 }
        requester_user_id: { type: integer, format: int64, description: One of the two requester fields is required. }
        node_ids:
          type: array
          items: { type: integer, format: int64 }
        reason: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 50000 }
        assignee_id: { type: integer, format: int64 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
    TransitionRequest:
      type: object
      required: [status_id]
      properties:
        status_id: { type: integer, format: int64 }
