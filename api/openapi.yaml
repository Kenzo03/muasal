openapi: 3.0.3
info:
  title: Muasal API
  version: 0.1.0
  description: >-
    The API the web app uses, open to scripts through personal access tokens (FSD §14.3). Send
    `Authorization: Bearer msl_…`; a token acts with its owner's visibility and role, a read-only token only reads
    (and may ask), and each token takes 60 requests a minute, bursting to 120. Browser sessions use the sid cookie
    and must send the app's Origin on writes.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in; the `sid` session cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Signed out; the session is revoked. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/setup:
    post:
      operationId: setupPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Password set; every session of the user is revoked. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/setup/account:
    post:
      operationId: getSetupAccount
      tags: [auth]
      description: >-
        The account a live setup link belongs to, so the setup page can name it (MSL-20). The token goes in the body,
        never the URL, to stay out of access logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                required: [name, email]
                properties:
                  name: { type: string }
                  email: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /me/tickets:
    get:
      operationId: listMyTickets
      tags: [me]
      description: >-
        Home's My tickets (FSD §6.4): the open tickets assigned to the caller in every project, as far as the caller
        may see them. view narrows them; the counts cover every view and project, whatever the view.
      parameters:
        - { name: view, in: query, schema: { $ref: "#/components/schemas/MyTicketsView" } }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of the caller's open tickets, with the counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTicketsPage" }
        default: { $ref: "#/components/responses/Problem" }
  /me/updates:
    get:
      operationId: listMyUpdates
      tags: [me]
      description: >-
        Home's Recently updated (FSD §6.4): the 10 tickets the caller may see that changed last, newest first, each
        with its latest change. A comment change carries no text.
      responses:
        "200":
          description: The latest changed tickets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentTicketList" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/setup:
    get:
      operationId: getSetupStatus
      tags: [admin]
      description: >-
        System admins only. How far this server is set up, for Home's first-run checklist (MSL-18): AI chosen, a
        second user, a project, a module tree and some tickets.
      responses:
        "200":
          description: The steps and whether each is done.
          content:
            application/json:
              schema:
                type: object
                required: [ai, invited, project, tree, history, first_project]
                properties:
                  ai: { type: boolean }
                  invited: { type: boolean }
                  project: { type: boolean }
                  tree: { type: boolean }
                  history: { type: boolean }
                  first_project: { type: string, description: The oldest project's key, or empty. }
        default: { $ref: "#/components/responses/Problem" }
  /me/attention:
    get:
      operationId: listMyAttention
      tags: [me]
      description: >-
        Home's Needs attention (MSL-9): per project the caller runs as project admin (every project for a system
        admin), the open tickets that are overdue, due within 7 days, unassigned, missing a reason or menu, with a
        weak reason, or unchanged for 7 days. Projects with none are left out.
      responses:
        "200":
          description: The projects that need attention.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionList" }
        default: { $ref: "#/components/responses/Problem" }
  /me/tokens:
    get:
      operationId: listTokens
      tags: [me]
      description: The caller's live API tokens, newest first (FSD §14.3). Never the secrets.
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createToken
      tags: [me]
      description: >-
        Creates a personal access token. The secret is in this response only; it is stored as a SHA-256 hash. Needs a
        signed-in session: a token cannot make tokens (403 session_required).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APITokenCreate" }
      responses:
        "201":
          description: The token, with its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenCreated" }
        default: { $ref: "#/components/responses/Problem" }
  /me/tokens/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: revokeToken
      tags: [me]
      description: Revokes one of the caller's tokens at once; requests with it then get 401. Needs a signed-in session.
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Problem" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [me]
      description: The caller's latest 50 notifications and the unread count (FSD §8.10). Tickets they can no longer see drop out.
      responses:
        "200":
          description: The notifications, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        default: { $ref: "#/components/responses/Problem" }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [me]
      description: Marks one notification read, or all of them without an id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, format: int64 }
      responses:
        "204": { description: Marked. }
        default: { $ref: "#/components/responses/Problem" }
  /notifications/stream:
    get:
      operationId: streamNotifications
      tags: [me]
      description: >-
        Server-sent events for the caller's open tabs (§8.10): a `notification` event carries each new Notification as
        it is recorded; a comment line every 15 seconds keeps proxies open.
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/mentionable:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMentionable
      tags: [tickets]
      description: Project members who can see the ticket, for @mentions in comments (§8.7). A mention is @ and the handle.
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentionableList" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createUser
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: The user, with a one-time setup link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedUser" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/users/{id}/setup-link:
    post:
      operationId: createSetupLink
      tags: [admin]
      description: Resets the password; the old one stops working and every session ends.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201":
          description: A new one-time setup link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupLink" }
        default: { $ref: "#/components/responses/Problem" }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: The projects the user belongs to; system admins see every project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProject
      tags: [projects]
      description: System admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: The new project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      description: Members only; everyone else gets 404.
      responses:
        "200":
          description: The project and the caller's role in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateProject
      tags: [projects]
      description: Project admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/clients:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectClients
      tags: [projects]
      description: Every member; members see only the clients in their scope.
      responses:
        "200":
          description: The clients linked to the project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setProjectClients
      tags: [projects]
      description: Project admins only. Replaces the linked clients; removing one that menus or member scopes use answers 409 client_in_use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectClientsUpdate" }
      responses:
        "200":
          description: The clients now linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      description: System admins and project admins.
      responses:
        "200":
          description: Every client, archived ones included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      tags: [clients]
      description: System admins and project admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreate" }
      responses:
        "201":
          description: The new client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        default: { $ref: "#/components/responses/Problem" }
  /clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateClient
      tags: [clients]
      description: System admins only. An empty code clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: The updated client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/members:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listProjectMembers
      tags: [projects]
      description: Project admins only.
      responses:
        "200":
          description: The project's members and their client scopes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setProjectMembers
      tags: [projects]
      description: Project admins only. Replaces every membership of the project at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembersUpdate" }
      responses:
        "200":
          description: The members now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/member-candidates:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMemberCandidates
      tags: [projects]
      description: Project admins only. The active users a project admin can add as members, by name (MSL-21).
      responses:
        "200":
          description: Users by name, members included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonList" }
        default: { $ref: "#/components/responses/Problem" }
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      description: Contacts of clients in the caller's scope plus internal contacts, at most 50, for type-ahead.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: client_id, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: internal, in: query, schema: { type: boolean }, description: Only internal people (no client). }
      responses:
        "200":
          description: Matching contacts, by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createContact
      tags: [contacts]
      description: Members and project admins, for clients in their scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "201":
          description: The new contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        default: { $ref: "#/components/responses/Problem" }
  /contacts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateContact
      tags: [contacts]
      description: Replaces every field; an omitted client_id makes the contact internal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/nodes:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listNodes
      tags: [nodes]
      description: The tree as a flat list. Client-specific menus outside the caller's scope, and what is under them, are left out.
      parameters:
        - { name: archived, in: query, schema: { type: boolean }, description: Project admins only; also list archived nodes. }
      responses:
        "200":
          description: Live nodes; siblings in position order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createNode
      tags: [nodes]
      description: Project admins only. The node goes last among its siblings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeCreate" }
      responses:
        "201":
          description: The new node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/nodes/import:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: importNodes
      tags: [nodes]
      description: >-
        Project admins import a module-tree CSV (FSD §7.5): the path shape or the adjacency shape, comma or semicolon,
        up to 5,000 rows. Rows match nodes by code, else by path; nothing is deleted. With dry_run it only plans. Any
        row error stops the whole import (AC-MR-7). The import runs in one transaction.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                dry_run: { type: boolean }
      responses:
        "200":
          description: The plan, and whether it was applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/nodes/recent:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRecentNodes
      tags: [nodes]
      description: >-
        The menus and modules of the caller's own latest tickets in the project, most recent first, at most 8, for
        "recently used first" in the menu picker (FSD §8.1). Only live nodes the caller sees.
      responses:
        "200":
          description: Node ids, most recent first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecentNodes" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getNode
      tags: [nodes]
      description: Every member who sees the node, archived or not (R-MR-4), with the path of its parents.
      responses:
        "200":
          description: The node and its path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDetail" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateNode
      tags: [nodes]
      description: Project admins only. Edits fields, and moves the node when `move` is present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeUpdate" }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteNode
      tags: [nodes]
      description: Project admins only. A node with sub-nodes answers 409 node_has_children.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{id}/merge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: mergeNode
      tags: [nodes]
      description: >-
        Project admins merge a duplicate into another node of the project (R-MR-6): its tickets, notes and live
        sub-nodes move to the target, its name and aliases become the target's aliases, and it is archived. The target
        cannot be the node, a node under it, or archived (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_id]
              properties:
                into_id: { type: integer, format: int64 }
      responses:
        "200":
          description: The target as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{id}/timeline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getNodeTimeline
      tags: [nodes]
      description: >-
        The visible tickets on the node, and by default on its sub-nodes: open ones first, newest first, then closed
        ones by close date, newest first, with their decision records (FSD §7.4). Pages follow next_cursor.
      parameters:
        - { name: sub_nodes, in: query, schema: { type: boolean, default: true } }
        - { name: client_id, in: query, schema: { type: integer, format: int64 } }
        - { name: core, in: query, schema: { type: boolean }, description: Only core work (no client). }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TicketType" } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Entries on or after this day; an entry's day is its close day, or its creation day while open. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Entries on or before this day. }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page of the timeline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        default: { $ref: "#/components/responses/Problem" }
  /nodes/{id}/behaviors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getNodeBehaviors
      tags: [nodes]
      description: The decisions in force on the node, and by default on its sub-nodes; core work first, then by client (FSD §7.4).
      parameters:
        - { name: sub_nodes, in: query, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Confirmed, implemented decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/statuses:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStatuses
      tags: [projects]
      description: Every member; the board, the list and the ticket page need them.
      responses:
        "200":
          description: The project's statuses in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setStatuses
      tags: [projects]
      description: Project admins only. Replaces the ordered list; tickets of a removed status move as `move_to` says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusesUpdate" }
      responses:
        "200":
          description: The statuses now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/assignees:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listAssignees
      tags: [projects]
      description: Members who can own tickets (not viewers).
      parameters:
        - { name: client_id, in: query, schema: { type: integer, format: int64 }, description: "Only those who may see this client's tickets (MSL-22)." }
      responses:
        "200":
          description: Assignable members by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefList" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/workload:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getWorkload
      tags: [tickets]
      description: >-
        Open tickets per person, for whoever leads the project: every member who can own tickets, even with none,
        then anyone else who still owns some, then unassigned work. The counts cover the tickets the caller may see.
      parameters:
        - { name: stale_days, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 365 }, description: What counts as stale; 7 by default. }
      responses:
        "200":
          description: One row per person by name, and a last row for unassigned tickets when there are any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workload" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/summary-schedules:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSummarySchedules
      tags: [summaries]
      description: Project admins. The project's weekly change summaries.
      responses:
        "200":
          description: By weekday, then client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryScheduleList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSummarySchedule
      tags: [summaries]
      description: >-
        Project admins. Every week on the weekday (by UTC date), a summary of the past seven days' closed tickets
        and decision notes, for one client with core work or for all clients, joins the scheduler's summaries and
        rings their bell. A week without changes writes none. With AI off or unavailable, the summary lists each
        change from its decision record instead of the model's prose.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryScheduleCreate" }
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummarySchedule" }
        default: { $ref: "#/components/responses/Problem" }
  /summary-schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteSummarySchedule
      tags: [summaries]
      description: Project admins. Summaries already written stay.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/tickets:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTickets
      tags: [tickets]
      description: The project's tickets the caller may see, filtered and sorted; pages follow next_cursor.
      parameters:
        - { name: status_id, in: query, schema: { type: integer, format: int64 } }
        - { name: category, in: query, schema: { $ref: "#/components/schemas/StatusCategory" } }
        - { name: open, in: query, schema: { type: boolean }, description: Only To do and In progress statuses. }
        - { name: closed_days, in: query, schema: { type: integer, format: int32, minimum: 1 }, description: Closed tickets only when closed within this many days; the board asks for 14. }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TicketType" } }
        - { name: client_id, in: query, schema: { type: integer, format: int64 } }
        - { name: core, in: query, schema: { type: boolean }, description: Only core work (no client). }
        - { name: assignee_id, in: query, schema: { type: integer, format: int64 } }
        - { name: mine, in: query, schema: { type: boolean }, description: Only tickets assigned to the caller. }
        - { name: unassigned, in: query, schema: { type: boolean }, description: Only tickets nobody owns. }
        - name: due
          in: query
          schema: { type: string, enum: [overdue, week] }
          description: Open tickets past their due date (overdue), or due from today through 7 days ahead (week), as Home counts them. Today is the date in the caller's timezone.
        - name: stale_days
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 365 }
          description: Open tickets unchanged for at least this many days; comments, files and decision records count as changes.
        - { name: node_id, in: query, schema: { type: integer, format: int64 }, description: Tickets on this node or its sub-nodes. }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Words in the title, or a ticket key. }
        - { name: missing, in: query, schema: { type: string, enum: [reason, menus, weak_reason] }, description: "weak_reason: a reason under 20 characters once stock phrases such as 'permintaan klien' are removed, the form's hint rule (R-DC-8)." }
        - { name: sort, in: query, schema: { type: string, enum: [updated, created, key, priority, due] } }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
          description: csv downloads every ticket of the filter, up to 10,000, as UTF-8 CSV instead of a page (FSD §8.5).
      responses:
        "200":
          description: One page of tickets; with format=csv, the whole filter as text/csv instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      tags: [tickets]
      description: Members and project admins. The ticket starts in the default status unless an open status_id is given.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 200 }
          description: >-
            A retry with the same key within 24 hours returns the ticket the first request created (200, with
            Idempotent-Replayed true) instead of a second ticket (FSD §17.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
      responses:
        "201":
          description: The new ticket; ETag carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, example: HRIS-231 } }
    get:
      operationId: getTicket
      tags: [tickets]
      responses:
        "200":
          description: The ticket; ETag carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateTicket
      tags: [tickets]
      description: Members and project admins. Replaces every editable field; a stale If-Match answers 412.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"7"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdate" }
      responses:
        "200":
          description: The updated ticket; ETag carries its new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/transition:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: transitionTicket
      tags: [tickets]
      description: >-
        Members and project admins. Entering a Done or Cancelled status is a close: it needs a reason, at least one
        menu and the decision record, else 422 close_validation_failed (FSD §9.1). Leaving one reopens the ticket and
        turns its decision record back into a draft. A stale If-Match answers 412.
      parameters:
        - { name: If-Match, in: header, schema: { type: string, example: '"7"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionRequest" }
      responses:
        "200":
          description: The ticket in its new status; ETag carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/documents:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listDocuments
      tags: [documents]
      description: The project's documents the caller may see (R-MR-15), newest first.
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadDocument
      tags: [documents]
      description: >-
        Project admins upload a PDF, DOCX or Markdown file up to 20 MB (FSD §7.7) with the Markdown the browser
        converted it to; headings become sections. supersedes names an older document of the project that this one
        replaces (R-MR-14).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, markdown, title]
              properties:
                file: { type: string, format: binary }
                markdown: { type: string }
                title: { type: string }
                client_id: { type: integer, format: int64 }
                supersedes: { type: string, description: An older document's key, e.g. HRIS-DOC1. }
      responses:
        "201":
          description: The stored document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDocument
      tags: [documents]
      description: A document with its Markdown, sections and tree drafts, for anyone who may see it.
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDocument
      tags: [documents]
      description: >-
        Project admins. Marks the document replaced by a newer document of the project, for when the upload did not
        say so, or current again with null (FSD §7.7). Only a current document can replace another. Ask then treats
        the replaced document's sections as history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{key}/file:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadDocument
      tags: [documents]
      description: The original file, as a download.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{key}/tree-drafts:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: startTreeDraft
      tags: [documents]
      description: >-
        Project admins draft a module tree from the document (§7.7). With AI Local or BYOK the model proposes it in a
        background job; with AI off the proposal comes from the headings and is ready at once (R-MR-11).
      responses:
        "202":
          description: The draft, running or ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeDraft" }
        default: { $ref: "#/components/responses/Problem" }
  /tree-drafts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getTreeDraft
      tags: [documents]
      description: Project admins read a draft and its progress.
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeDraft" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: saveTreeDraft
      tags: [documents]
      description: Saves the reviewed proposal of a ready draft; the tree does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal]
              properties:
                proposal: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/TreeDraftNode" } }
      responses:
        "200":
          description: The draft as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeDraft" }
        default: { $ref: "#/components/responses/Problem" }
  /tree-drafts/{id}/apply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: applyTreeDraft
      tags: [documents]
      description: >-
        Creates the ticked nodes the tree lacks in one transaction, with source ai_draft and their descriptions, and
        links every proposed node's sections to it (§7.7). A ticked node needs its parent ticked or existing, and
        names must be unique among siblings (422).
      responses:
        "200":
          description: What changed.
          content:
            application/json:
              schema:
                type: object
                required: [created, linked]
                properties:
                  created: { type: integer }
                  linked: { type: integer, description: Section links written. }
        default: { $ref: "#/components/responses/Problem" }
  /tree-drafts/{id}/discard:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: discardTreeDraft
      tags: [documents]
      responses:
        "204": { description: Discarded. }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/decision-draft:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: draftDecision
      tags: [tickets]
      description: >-
        Members draft the decision record with the chat model (FSD §9.3) from the ticket's title, type, client, menus,
        reason, description, latest 30 comments and linked commit messages. Nothing is saved. When the thread never
        says why, why is empty. AI off answers 409 ai_off; model failures answer 503 ai_unavailable, ai_busy,
        ai_timeout or ai_invalid.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { $ref: "#/components/schemas/SummaryLanguage" }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionDraft" }
        default: { $ref: "#/components/responses/Problem" }
  /summaries/preview:
    post:
      operationId: previewSummary
      tags: [summaries]
      description: >-
        Lists every visible closed ticket and decision note in the scope, by menu, oldest first (FSD §12.1), and
        names the model that would receive the ticked items. No model call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryScope" }
      responses:
        "200":
          description: The items in scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /summaries:
    get:
      operationId: listSummaries
      tags: [summaries]
      description: The caller's summaries, and every summary of the projects they administer (§12.1).
      parameters:
        - { name: project, in: query, schema: { type: string }, description: A project key. }
      responses:
        "200":
          description: The latest 100.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSummary
      tags: [summaries]
      description: >-
        Generates a change summary from the ticked items (§12.1): one model call per menu group of up to 40 items,
        and one for the overview when there are several groups. Every bullet cites its items; bullets citing nothing
        in their group are dropped. Client-facing summaries use decision records and Client-safe comments only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryCreate" }
      responses:
        "201":
          description: The saved summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        default: { $ref: "#/components/responses/Problem" }
  /summaries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getSummary
      tags: [summaries]
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateSummary
      tags: [summaries]
      description: Edits the title and markdown; tickets never change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryUpdate" }
      responses:
        "200":
          description: The summary as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/decision:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateDecision
      tags: [tickets]
      description: >-
        Project admins and the confirmer reword a confirmed decision record (R-DC-5); every edit is audited.
        A ticket without a confirmed record answers 409 decision_not_confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "200":
          description: The record as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionRecord" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/links:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: createLink
      tags: [tickets]
      description: >-
        Members link this ticket to another they can see, in any project (FSD §8.8, R-TK-6). A reverses link
        supersedes the other ticket's decision (R-TK-5). A self-link answers 422; an existing link of the same type
        answers 409 link_exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkCreate" }
      responses:
        "201":
          description: The link as this ticket shows it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketLink" }
        default: { $ref: "#/components/responses/Problem" }
  /links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteLink
      tags: [tickets]
      description: >-
        Members of the linking ticket's project. Removing a reverses link makes the other decision current again
        unless another reverses link still points at it (R-TK-7).
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/activity:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTicketActivity
      tags: [tickets]
      responses:
        "200":
          description: Comments and history, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/comments:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: createComment
      tags: [tickets]
      description: Members and project admins. Internal unless internal is false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentInput" }
      responses:
        "201":
          description: The comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityItem" }
        default: { $ref: "#/components/responses/Problem" }
  /comments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateComment
      tags: [tickets]
      description: The author only. The history keeps the earlier text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentUpdate" }
      responses:
        "200":
          description: The comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityItem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteComment
      tags: [tickets]
      description: The author only. Readers then see "Comment deleted".
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /tickets/{key}/attachments:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: uploadAttachment
      tags: [tickets]
      description: Members and project admins. Up to 25 MB; images, PDF, Office and OpenDocument files, text, CSV, logs and ZIP.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
  /attachments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: downloadAttachment
      tags: [tickets]
      description: Anyone who can see the ticket. Images display inline; other files download.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAttachment
      tags: [tickets]
      description: The uploader or a project admin.
      responses:
        "204": { description: Removed from the ticket. }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/notes:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listNotes
      tags: [notes]
      description: The project's decision notes the reader may see, newest decision first (FSD §9.4).
      parameters:
        - { name: archived, in: query, schema: { type: boolean }, description: Include archived notes. }
      responses:
        "200":
          description: At most 500 notes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createNote
      tags: [notes]
      description: Members record a decision made outside tickets, such as in a meeting or a call (FSD §9.4, DC-3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default: { $ref: "#/components/responses/Problem" }
  /notes/{noteKey}:
    parameters:
      - { name: noteKey, in: path, required: true, schema: { type: string, example: HRIS-DN7 } }
    get:
      operationId: getNote
      tags: [notes]
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateNote
      tags: [notes]
      description: The author and project admins. Replaces every field; archived archives or restores. Every edit is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: The note as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        default: { $ref: "#/components/responses/Problem" }
  /imports:
    get:
      operationId: listImports
      tags: [admin]
      description: System admins. Ticket imports, newest first (FSD §14.2).
      responses:
        "200":
          description: The last 100 imports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRunList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createImport
      tags: [admin]
      description: >-
        System admins upload a UTF-8 CSV (comma or semicolon) or Jira's "Export Excel CSV (all fields)", up to 200 MB,
        into a new import for one project, and get its dry run: counts to create, update and reject, the first 20
        errors and module coverage (§14.2). preset jira maps Jira's columns; mapping, a JSON ImportMapping, overrides it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, project_key]
              properties:
                file: { type: string, format: binary }
                project_key: { type: string }
                preset: { type: string, enum: [csv, jira] }
                mapping: { type: string, description: An ImportMapping as JSON. }
      responses:
        "201":
          description: The import with its dry run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        default: { $ref: "#/components/responses/Problem" }
  /imports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getImport
      tags: [admin]
      description: System admins. The import, its dry run and, while it runs, its progress.
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        default: { $ref: "#/components/responses/Problem" }
  /imports/{id}/plan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: planImport
      tags: [admin]
      description: System admins change the mapping and dry-run again, until the import runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportMapping" }
      responses:
        "200":
          description: The import with its new dry run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        default: { $ref: "#/components/responses/Problem" }
  /imports/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: runImport
      tags: [admin]
      description: >-
        System admins start a dry-run import as a background job in batches of 500, resumable after a failure. Rows
        the dry run rejected are skipped. Tickets match on their old key, so running a file again updates instead of
        duplicating (R-IN-1, AC-IN-3).
      responses:
        "202":
          description: The import, now running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportRun" }
        default: { $ref: "#/components/responses/Problem" }
  /projects/{key}/repos:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRepos
      tags: [projects]
      description: Project admins. The project's Git repositories with their webhook URLs (FSD §14.1).
      responses:
        "200":
          description: The repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createRepo
      tags: [projects]
      description: >-
        Project admins add a repository. The answer carries the webhook URL and a generated secret, shown this once,
        to paste into the Git server. Needs APP_SECRET_KEY (409 secret_key_missing).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepoInput" }
      responses:
        "201":
          description: The repository with its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        default: { $ref: "#/components/responses/Problem" }
  /repos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateRepo
      tags: [projects]
      description: Project admins rename a repository or, with new_secret, replace its secret (shown once in the answer).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepoUpdate" }
      responses:
        "200":
          description: The repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteRepo
      tags: [projects]
      description: Project admins remove a repository with its commits and merge requests.
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /search:
    get:
      operationId: search
      tags: [search]
      description: >-
        Tickets and nodes the caller may open, across their projects (FSD §6.1): a ticket key, words in a ticket or
        part of its title; part of a node's name, an alias or its code. Fewer than 2 characters find nothing.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: At most 50 tickets and 20 nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/settings/ai:
    get:
      operationId: getAISettings
      tags: [admin]
      description: System admins. AI mode, endpoints, models and tuning (FSD §13.4). API keys are never returned, only whether one is saved.
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAISettings
      tags: [admin]
      description: >-
        System admins. Bring your own key needs a provider, a key and the acknowledgement that questions and ticket
        excerpts go to that provider, else 422 with byok_not_acknowledged (R-AI-1); nothing is sent to the provider.
        A key needs APP_SECRET_KEY on the server. Every save is audited, keys never.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AISettingsUpdate" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/ai/test:
    post:
      operationId: testAI
      tags: [admin]
      description: >-
        System admins. Tries the given settings without saving them: lists the chat server's models, runs a
        one-sentence chat and one embedding, and reports latencies and the embedding dimension (§13.4). Keys left out
        come from the saved settings. BYOK without the acknowledgement answers 422 and calls nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AISettingsUpdate" }
      responses:
        "200":
          description: One probe per endpoint; a failed probe carries its error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AITestResult" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/ai/status:
    get:
      operationId: getAIStatus
      tags: [admin]
      description: System admins. Index status (FSD §13.3) - chunks per embedding model, chunks waiting for a vector, queued and failed index jobs.
      responses:
        "200":
          description: The index now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/ai/reindex:
    post:
      operationId: reindexAI
      tags: [admin]
      description: System admins. Queues an index job for every ticket (all), or retries the index jobs that used up their attempts (failed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReindexRequest" }
      responses:
        "202":
          description: Jobs queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReindexResult" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/ask-log:
    get:
      operationId: listAskLog
      tags: [admin]
      description: >-
        System admins (FSD §10.8, §15.4). Every question, newest first. Quick filters - thumbs-down, not enough
        information, slower than 30 seconds - plus status and asker; page with before, the last id of the previous page.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [answered, not_enough_info, ai_off, error] } }
        - { name: slow, in: query, schema: { type: boolean }, description: Only answers slower than 30 seconds. }
        - { name: down, in: query, schema: { type: boolean }, description: Only answers rated thumbs-down. }
        - { name: user_id, in: query, schema: { type: integer, format: int64 } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskLogPage" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/ask-log/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getAskLogEntry
      tags: [admin]
      description: System admins. One question with its exact scope, evidence and scores, answer and dropped claims (§15.4).
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskLogDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      description: System admins. The audit log, newest first, filtered by actor, entity, action and date (§15.4); read-only.
      parameters:
        - { name: actor_id, in: query, schema: { type: integer, format: int64 } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit/export:
    get:
      operationId: exportAudit
      tags: [admin]
      description: System admins. The filtered audit log as CSV, newest first, at most 100,000 rows.
      parameters:
        - { name: actor_id, in: query, schema: { type: integer, format: int64 } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV with a header row.
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /admin/backups:
    get:
      operationId: listBackups
      tags: [admin]
      description: System admins (FSD §15.6). The database dumps in the backups volume, newest first, and whether a run is waiting.
      responses:
        "200":
          description: The backups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/backups/run:
    post:
      operationId: runBackup
      tags: [admin]
      description: System admins. Asks the backup service for a backup now; it starts within 30 seconds (§19.4).
      responses:
        "202": { description: Requested. }
        default: { $ref: "#/components/responses/Problem" }
  /admin/system/status:
    get:
      operationId: getSystemStatus
      tags: [admin]
      description: >-
        System admins (FSD §18.3). Database size, job queue depth, model server health and the disk use of the
        attachments and backups volumes; warnings from 80% disk use.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /ask:
    post:
      operationId: ask
      tags: [ask]
      description: >-
        Everyone signed in (FSD §10, §11). Answers from the tickets the asker may open, with a citation on every claim,
        or says it lacks information. With Accept text/event-stream the answer streams as events - queued, scope,
        evidence, claim, result, error (§11.6) - and a comment line every 15 seconds keeps proxies open; otherwise the
        final AskResult comes as JSON. With AI off it returns keyword results under the same scope. 10 questions a
        minute per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResult" }
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /ask/queries/{id}/feedback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: sendAskFeedback
      tags: [ask]
      description: >-
        The asker rates an answer (FSD §10.7, AK-8): thumbs up, or down with reasons and free text. A later rating
        replaces the earlier one. Another user's question answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskFeedback" }
      responses:
        "204": { description: Saved. }
        default: { $ref: "#/components/responses/Problem" }
  /ask/threads:
    get:
      operationId: listAskThreads
      tags: [ask]
      description: The asker's own threads, newest first (§10.6).
      responses:
        "200":
          description: At most 100 threads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskThreadList" }
        default: { $ref: "#/components/responses/Problem" }
  /ask/threads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getAskThread
      tags: [ask]
      description: One of the asker's threads with its questions and answers; anyone else's answers 404.
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskThreadDetail" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: hideAskThread
      tags: [ask]
      description: Hides the thread from the asker's list; the Ask log keeps it until retention expires (§10.6).
      responses:
        "204": { description: Hidden. }
        default: { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Locale:
      type: string
      enum: [id, en]
    User:
      type: object
      required: [id, email, name, is_admin, locale, timezone, disabled, has_password, created_at, last_login_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string, example: Asia/Jakarta }
        disabled: { type: boolean }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        notify_prefs: { $ref: "#/components/schemas/NotifyPrefs" }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 320 }
        password: { type: string, maxLength: 1024 }
    SetupRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, maxLength: 1024 }
    MeUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        current_password: { type: string, maxLength: 1024 }
        new_password: { type: string, maxLength: 1024 }
        notify_prefs: { $ref: "#/components/schemas/NotifyPrefs" }
    UserCreate:
      type: object
      required: [email, name]
      properties:
        email: { type: string, maxLength: 320 }
        name: { type: string, maxLength: 200 }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
    UserUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        is_admin: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        disabled: { type: boolean }
    SetupLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
    CreatedUser:
      type: object
      required: [user, setup_link]
      properties:
        user: { $ref: "#/components/schemas/User" }
        setup_link: { $ref: "#/components/schemas/SetupLink" }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ProjectRole:
      type: string
      enum: [admin, member, viewer]
    Project:
      type: object
      required: [id, key, name, description, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: HRIS }
        name: { type: string }
        description: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        created_at: { type: string, format: date-time }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key: { type: string, maxLength: 10, description: "2–10 capital letters or digits, starting with a letter; lower case is accepted" }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        template_key:
          type: string
          description: >-
            A project whose statuses and live module tree the new project copies. Client-specific menus arrive as
            shared ones, since the new project links no clients yet.
    ProjectUpdate:
      type: object
      properties:
        key: { type: string, maxLength: 10 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    Client:
      type: object
      required: [id, name, code, aliases, archived]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string, nullable: true, example: CLA }
        aliases:
          type: array
          items: { type: string }
        archived: { type: boolean }
    ClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Client" }
    ClientCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 20 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
    ClientUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 20 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        archived: { type: boolean }
    ProjectClientsUpdate:
      type: object
      required: [client_ids]
      properties:
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    Member:
      type: object
      required: [user_id, name, email, role, all_clients, client_ids]
      properties:
        user_id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/ProjectRole" }
        all_clients: { type: boolean }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    Person:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
    PersonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Person" }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberInput:
      type: object
      required: [email, role, all_clients]
      properties:
        email: { type: string, maxLength: 320 }
        role: { $ref: "#/components/schemas/ProjectRole" }
        all_clients: { type: boolean, description: Project admins always have all clients. }
        client_ids:
          type: array
          description: The clients a scoped member sees; ignored with all_clients.
          items: { type: integer, format: int64 }
    MembersUpdate:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberInput" }
    Contact:
      type: object
      required: [id, client_id, client_name, name, title, email, phone]
      properties:
        id: { type: integer, format: int64 }
        client_id: { type: integer, format: int64, nullable: true }
        client_name: { type: string, nullable: true }
        name: { type: string }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    ContactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
    ContactInput:
      type: object
      required: [name]
      properties:
        client_id: { type: integer, format: int64, description: Omitted for internal people. }
        name: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 320 }
        phone: { type: string, maxLength: 50 }
    NodeType:
      type: string
      enum: [module, menu]
    NodeClient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Node:
      type: object
      required: [id, parent_id, type, name, code, aliases, description, client_specific, clients, position, archived]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, nullable: true }
        type: { $ref: "#/components/schemas/NodeType" }
        name: { type: string }
        code: { type: string, nullable: true, example: HR.ATT.OT_APPROVAL }
        aliases:
          type: array
          items: { type: string }
        description: { type: string }
        client_specific: { type: boolean }
        clients:
          type: array
          description: The node's clients within the caller's scope.
          items: { $ref: "#/components/schemas/NodeClient" }
        position: { type: integer, format: int32 }
        archived: { type: boolean }
    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Node" }
    NodeCreate:
      type: object
      required: [type, name]
      properties:
        parent_id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/NodeType" }
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 100 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        client_specific: { type: boolean }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
    NodeUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        type: { $ref: "#/components/schemas/NodeType" }
        code: { type: string, maxLength: 100, description: An empty code clears it. }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 5000 }
        client_specific: { type: boolean, description: When present, client_ids replaces the node's clients. }
        client_ids:
          type: array
          items: { type: integer, format: int64 }
        move: { $ref: "#/components/schemas/NodeMove" }
        archived: { type: boolean, description: Archive (true) or restore (false); a linked node is archived, never deleted. }
    NodeMove:
      type: object
      properties:
        parent_id: { type: integer, format: int64, nullable: true, description: Omitted or null moves to the top level. }
        position: { type: integer, format: int32, minimum: 0, description: Index among the new siblings; omitted puts the node last. }
    NodeDetail:
      type: object
      required: [node, path, project_key]
      properties:
        node: { $ref: "#/components/schemas/Node" }
        path:
          type: array
          description: The node's parents, top first.
          items: { $ref: "#/components/schemas/Ref" }
        project_key: { type: string }
    TimelineEntry:
      type: object
      required: [key, title, type, status, requester, created_at]
      properties:
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/Status" }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/TicketRequester" }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        decision: { $ref: "#/components/schemas/DecisionRecord" }
    TimelinePage:
      type: object
      required: [items, notes, sections, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineEntry" }
        notes:
          type: array
          description: >-
            Decision notes on the node, newest decision first (FSD §9.4). Only the first page carries them, all of
            them; later pages, and a ticket type filter, leave the list empty.
          items: { $ref: "#/components/schemas/TimelineNote" }
        sections:
          type: array
          description: >-
            The document sections the node and its sub-nodes came from (FSD §7.7): where their history starts.
            Current documents first, newest upload first. Carried like notes: the first page only, and none with a
            ticket type filter.
          items: { $ref: "#/components/schemas/TimelineSection" }
        next_cursor: { type: string, nullable: true }
    TimelineSection:
      type: object
      required: [key, document_key, document_title, title, excerpt, uploaded_at]
      properties:
        key: { type: string, example: HRIS-DOC1/7.4, description: The section's citation, as Ask writes it. }
        document_key: { type: string }
        document_title: { type: string }
        title: { type: string }
        excerpt: { type: string, description: The start of the section's Markdown. }
        uploaded_at: { type: string, format: date-time }
        client: { $ref: "#/components/schemas/Ref" }
        superseded_by: { type: string, description: The key of the document that replaced this one. }
    TimelineNote:
      type: object
      required: [key, title, decided_on, attendees, body, author]
      properties:
        key: { type: string, example: HRIS-DN7 }
        title: { type: string }
        decided_on: { type: string, format: date }
        client: { $ref: "#/components/schemas/Ref" }
        attendees: { type: string }
        body: { type: string }
        author: { type: string }
    Behavior:
      type: object
      required: [key, title, what_changed, why, alternatives, unconfirmed]
      properties:
        unconfirmed: { type: boolean, description: "A done ticket without a confirmed decision record, such as an imported one: what_changed is its title and why its reason (MSL-13)." }
        key: { type: string }
        title: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        closed_at: { type: string, format: date-time }
        what_changed: { type: string }
        why: { type: string }
        alternatives: { type: string }
    BehaviorList:
      type: object
      required: [items, sections]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Behavior" }
        sections:
          type: array
          description: The linked sections of the documents in force, not replaced ones; the spec's baseline under the decisions (MSL-39).
          items: { $ref: "#/components/schemas/TimelineSection" }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    RefList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Ref" }
    StatusCategory:
      type: string
      enum: [todo, in_progress, done, cancelled]
    Status:
      type: object
      required: [id, name, category, color, position, is_default]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { $ref: "#/components/schemas/StatusCategory" }
        color: { type: string, example: "#2563EB" }
        position: { type: integer, format: int32 }
        is_default: { type: boolean }
    StatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Status" }
    StatusInput:
      type: object
      required: [name, category, color]
      properties:
        id: { type: integer, format: int64, description: An existing status; omitted adds one. }
        name: { type: string, maxLength: 50 }
        category: { $ref: "#/components/schemas/StatusCategory" }
        color: { type: string, example: "#2563EB" }
        is_default: { type: boolean }
    StatusMove:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, format: int64, description: A removed status. }
        to: { type: integer, format: int64, description: A kept status of the same open or closed kind. }
    StatusesUpdate:
      type: object
      required: [statuses]
      properties:
        statuses:
          type: array
          items: { $ref: "#/components/schemas/StatusInput" }
        move_to:
          type: array
          items: { $ref: "#/components/schemas/StatusMove" }
    TicketType:
      type: string
      enum: [bug, change_request, feature]
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    TicketRequester:
      type: object
      required: [kind, id, name, title]
      properties:
        kind: { type: string, enum: [contact, user] }
        id: { type: integer, format: int64 }
        name: { type: string }
        title: { type: string, nullable: true, example: HR Manager }
    NodeRef:
      type: object
      required: [id, name, archived]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        archived: { type: boolean }
    Attachment:
      type: object
      required: [id, filename, content_type, size_bytes, uploader, created_at]
      properties:
        id: { type: integer, format: int64 }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        uploader: { $ref: "#/components/schemas/Ref" }
        created_at: { type: string, format: date-time }
    Ticket:
      type: object
      required: [id, key, project_key, title, type, description, reason, status, requester, reporter, priority, due_date, nodes, attachments, links, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: HRIS-231 }
        project_key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        description: { type: string }
        reason: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        client: { $ref: "#/components/schemas/Ref" }
        requester: { $ref: "#/components/schemas/TicketRequester" }
        reporter: { $ref: "#/components/schemas/Ref" }
        assignee: { $ref: "#/components/schemas/Ref" }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NodeRef" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        version: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true, description: Set on close, cleared on reopen. }
        decision: { $ref: "#/components/schemas/DecisionRecord" }
        links:
          type: array
          description: Links to tickets the reader can see, oldest first (FSD §8.8).
          items: { $ref: "#/components/schemas/TicketLink" }
        code: { $ref: "#/components/schemas/TicketCode" }
    TicketCreate:
      type: object
      required: [type, title, node_ids]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        title: { type: string, maxLength: 200 }
        client_id: { type: integer, format: int64, description: Omitted for core work (all clients). }
        requester_contact_id: { type: integer, format: int64 }
        requester_user_id: { type: integer, format: int64, description: Without a requester the reporter is the requester. }
        node_ids:
          type: array
          items: { type: integer, format: int64 }
        reason: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 50000 }
        assignee_id: { type: integer, format: int64 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        status_id: { type: integer, format: int64, description: An open status; omitted means the project's default. }
        note_key: { type: string, description: "A decision note of this project the caller may see, e.g. HRIS-DN7: the ticket joins its tickets, as when filed from one of its action items (MSL-11)." }
    TicketUpdate:
      type: object
      description: Replaces every editable field; send the current value of each field you keep.
      required: [type, title, node_ids]
      properties:
        type: { $ref: "#/components/schemas/TicketType" }
        title: { type: string, maxLength: 200 }
        client_id: { type: integer, format: int64, description: Omitted for core work (all clients). }
        requester_contact_id: { type: integer, format: int64 }
        requester_user_id: { type: integer, format: int64, description: One of the two requester fields is required. }
        node_ids:
          type: array
          items: { type: integer, format: int64 }
        reason: { type: string, maxLength: 2000 }
        description: { type: string, maxLength: 50000 }
        assignee_id: { type: integer, format: int64 }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
    TransitionRequest:
      type: object
      required: [status_id]
      properties:
        status_id: { type: integer, format: int64 }
        reason: { type: string, maxLength: 2000, description: A close only; replaces the ticket's reason. }
        node_ids:
          type: array
          description: A close only; replaces the ticket's menus.
          items: { type: integer, format: int64 }
        decision: { $ref: "#/components/schemas/DecisionInput" }
    DecisionInput:
      type: object
      required: [what_changed, why]
      properties:
        what_changed: { type: string, maxLength: 1000 }
        why: { type: string, maxLength: 2000 }
        alternatives: { type: string, maxLength: 2000 }
        ai_drafted: { type: boolean, description: The fields started from "Draft with AI" (§9.3). }
    DocumentListItem:
      type: object
      required: [key, title, filename, uploaded_by, created_at]
      properties:
        key: { type: string, example: HRIS-DOC1 }
        title: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        filename: { type: string }
        uploaded_by: { type: string }
        created_at: { type: string, format: date-time }
        superseded_by: { type: string }
    DocumentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DocumentListItem" } }
    DocumentSection:
      type: object
      required: [number, title, level, body, nodes]
      properties:
        number: { type: string, example: "7.4" }
        title: { type: string }
        level: { type: integer }
        body: { type: string, description: The Markdown under the heading. }
        nodes: { type: array, items: { $ref: "#/components/schemas/Ref" }, description: The nodes this section produced. }
    DocumentUpdate:
      type: object
      required: [superseded_by]
      properties:
        superseded_by: { type: string, nullable: true, description: A newer document's key, e.g. HRIS-DOC2; null makes this document current again. }
    Document:
      type: object
      required: [key, project_key, title, filename, markdown, sections, drafts, replaces, uploaded_by, created_at]
      properties:
        key: { type: string }
        project_key: { type: string }
        title: { type: string }
        client: { $ref: "#/components/schemas/Ref" }
        filename: { type: string }
        markdown: { type: string }
        sections: { type: array, items: { $ref: "#/components/schemas/DocumentSection" } }
        replaces:
          type: array
          description: The documents this one replaced (MSL-14).
          items:
            type: object
            required: [key, title]
            properties:
              key: { type: string }
              title: { type: string }
        drafts:
          type: array
          items:
            type: object
            required: [id, status, created_at]
            properties:
              id: { type: integer, format: int64 }
              status: { $ref: "#/components/schemas/TreeDraftStatus" }
              created_at: { type: string, format: date-time }
        uploaded_by: { type: string }
        created_at: { type: string, format: date-time }
        superseded_by: { type: string }
    TreeDraftStatus:
      type: string
      enum: [running, ready, applied, discarded, failed]
    TreeDraftNode:
      type: object
      required: [tmp_id, parent, type, name, aliases, description, sections, keep, exists]
      properties:
        tmp_id: { type: string }
        parent: { type: string, description: Another node's tmp_id, or empty at the top. }
        type: { $ref: "#/components/schemas/NodeType" }
        name: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, maxLength: 100, description: "The ID its heading ends with, such as SO-02 from \"Persetujuan Sales Order (SO-02)\"; applying sets it unless another node has it." }
        aliases: { type: array, maxItems: 3, items: { type: string } }
        description: { type: string, maxLength: 300 }
        sections: { type: array, items: { type: string }, description: Source section numbers. }
        keep: { type: boolean }
        exists: { type: boolean, description: The tree already has this path; applying leaves it unchanged. }
        duplicate: { type: string, description: A sibling's tmp_id whose name is nearly the same. }
    TreeDraft:
      type: object
      required: [id, document_key, document_title, status, used_ai, done_parts, total_parts, proposal, created_at]
      properties:
        id: { type: integer, format: int64 }
        document_key: { type: string }
        document_title: { type: string }
        status: { $ref: "#/components/schemas/TreeDraftStatus" }
        used_ai: { type: boolean, description: False when the proposal came from the headings (AI off). }
        done_parts: { type: integer }
        total_parts: { type: integer }
        error: { type: string }
        proposal: { type: array, items: { $ref: "#/components/schemas/TreeDraftNode" } }
        created_at: { type: string, format: date-time }
    DecisionDraft:
      type: object
      required: [what_changed, why, alternatives, model]
      properties:
        what_changed: { type: string }
        why: { type: string, description: Empty when the thread never says why (AC-DC-7). }
        alternatives: { type: string }
        model: { type: string, example: "Local · qwen3.5:9b" }
    SummaryLanguage:
      type: string
      enum: [id, en]
    SummaryAudience:
      type: string
      enum: [internal, client]
    SummaryScope:
      type: object
      required: [project_key, node_id, from, to, language, audience]
      properties:
        project_key: { type: string }
        node_id: { type: integer, format: int64, description: "The node, with its sub-nodes; 0 covers the whole project, as a weekly summary does." }
        client_id: { type: integer, format: int64, description: One client; omitted for all. }
        from: { type: string, format: date }
        to: { type: string, format: date }
        include_cancelled: { type: boolean }
        language: { $ref: "#/components/schemas/SummaryLanguage" }
        audience: { $ref: "#/components/schemas/SummaryAudience" }
    SummaryItemKind:
      type: string
      enum: [ticket, note]
    SummaryItem:
      type: object
      required: [key, kind, title, date, menu]
      properties:
        key: { type: string }
        kind: { $ref: "#/components/schemas/SummaryItemKind" }
        title: { type: string }
        date: { type: string, format: date, description: The close date, or a note's decision date. }
        menu: { type: string }
        client: { type: string }
        requested_by: { type: string }
        cancelled: { type: boolean }
    SummaryPreview:
      type: object
      required: [items, model, cloud]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SummaryItem" } }
        model: { type: string, description: The model badge, or empty when AI is off. }
        cloud: { type: boolean, description: The ticked items go to a cloud provider (BYOK). }
    SummaryCreate:
      allOf:
        - { $ref: "#/components/schemas/SummaryScope" }
        - type: object
          required: [keys]
          properties:
            keys: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
    SummaryUpdate:
      type: object
      required: [title, markdown]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        markdown: { type: string, maxLength: 200000 }
    Summary:
      type: object
      required: [id, project_key, title, markdown, scope, items, model, created_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        project_key: { type: string }
        title: { type: string }
        markdown: { type: string }
        scope: { $ref: "#/components/schemas/SummaryScope" }
        items: { type: array, items: { $ref: "#/components/schemas/SummaryItem" } }
        model: { type: string }
        created_by: { $ref: "#/components/schemas/Ref" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SummaryListItem:
      type: object
      required: [id, project_key, title, creator, created_at]
      properties:
        id: { type: integer, format: int64 }
        project_key: { type: string }
        title: { type: string }
        creator: { type: string }
        created_at: { type: string, format: date-time }
    SummaryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SummaryListItem" } }
    SummarySchedule:
      type: object
      required: [id, language, audience, weekday, created_by]
      properties:
        id: { type: integer, format: int64 }
        client: { $ref: "#/components/schemas/Ref" }
        language: { $ref: "#/components/schemas/SummaryLanguage" }
        audience: { $ref: "#/components/schemas/SummaryAudience" }
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday: 1 is Monday." }
        created_by: { $ref: "#/components/schemas/Ref" }
        last_run_on: { type: string, format: date, description: The day it last ran; omitted before its first run. }
    SummaryScheduleCreate:
      type: object
      required: [language, audience, weekday]
      properties:
        client_id: { type: integer, format: int64, description: One client, with core work; omitted for all clients. }
        language: { $ref: "#/components/schemas/SummaryLanguage" }
        audience: { $ref: "#/components/schemas/SummaryAudience" }
        weekday: { type: integer, minimum: 1, maximum: 7 }
    SummaryScheduleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SummarySchedule" } }
    WorkloadRow:
      type: object
      required: [open, in_progress, overdue, due_week, stale, high]
      properties:
        assignee: { $ref: "#/components/schemas/Ref" }
        open: { type: integer, description: To do and In progress. }
        in_progress: { type: integer }
        overdue: { type: integer, description: "Due before today, the date in the caller's timezone." }
        due_week: { type: integer, description: Due from today through 7 days ahead. }
        stale: { type: integer, description: Unchanged for stale_days or more. }
        high: { type: integer, description: Urgent or high priority. }
    Workload:
      type: object
      required: [rows, stale_days]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/WorkloadRow" }, description: "People by name; a row without assignee counts unassigned tickets." }
        stale_days: { type: integer }
    DecisionOutcome:
      type: string
      enum: [implemented, rejected]
    DecisionState:
      type: string
      enum: [draft, confirmed]
    DecisionRecord:
      type: object
      required: [what_changed, why, alternatives, outcome, state]
      properties:
        what_changed: { type: string }
        why: { type: string }
        alternatives: { type: string }
        outcome: { $ref: "#/components/schemas/DecisionOutcome" }
        state: { $ref: "#/components/schemas/DecisionState" }
        confirmed_by: { $ref: "#/components/schemas/Ref" }
        confirmed_at: { type: string, format: date-time }
        superseded_by: { type: string, description: The key of the ticket that reverses this decision (R-TK-5). }
        ai_drafted: { type: boolean }
    LinkType:
      type: string
      enum: [reverses, extends, related_to]
    LinkCreate:
      type: object
      required: [type, key]
      properties:
        type: { $ref: "#/components/schemas/LinkType" }
        key: { type: string, description: The other ticket, e.g. HRIS-88. This ticket reverses, extends or relates to it. }
    TicketLink:
      type: object
      required: [id, type, outgoing, ticket]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/LinkType" }
        outgoing: { type: boolean, description: True when this ticket is the one that reverses or extends; false reads "Reversed by". }
        ticket: { $ref: "#/components/schemas/LinkedTicket" }
    LinkedTicket:
      type: object
      required: [key, title, status]
      properties:
        key: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        closed_at: { type: string, format: date-time, nullable: true }
    TicketSummary:
      type: object
      required: [id, key, title, type, priority, due_date, status_id, requester_name, node_names, missing_reason, updated_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date, nullable: true }
        status_id: { type: integer, format: int64 }
        client: { $ref: "#/components/schemas/Ref" }
        assignee: { $ref: "#/components/schemas/Ref" }
        requester_name: { type: string }
        node_names:
          type: array
          items: { type: string }
        missing_reason: { type: boolean }
        updated_at: { type: string, format: date-time }
    TicketPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TicketSummary" }
        next_cursor: { type: string, nullable: true }
    ActivityItem:
      type: object
      required: [kind, at]
      properties:
        kind: { type: string, enum: [comment, event] }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Ref" }
        comment_id: { type: integer, format: int64 }
        internal: { type: boolean }
        body: { type: string, description: A comment's text; absent when deleted, except for system admins. }
        deleted: { type: boolean }
        edited: { type: boolean }
        action: { type: string, example: transition }
        changes: { type: object, additionalProperties: true }
    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
        internal: { type: boolean, description: Defaults to true; false marks the comment client-safe. }
    CommentUpdate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 20000 }
    SearchTicket:
      type: object
      required: [key, title, project_key, status]
      properties:
        key: { type: string }
        title: { type: string }
        project_key: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        client: { $ref: "#/components/schemas/Ref" }
    SearchNode:
      type: object
      required: [id, name, type, code, aliases, project_key, path]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: "#/components/schemas/NodeType" }
        code: { type: string, nullable: true }
        aliases:
          type: array
          items: { type: string }
        project_key: { type: string }
        path:
          type: array
          description: The names from the top of the tree down to this node.
          items: { type: string }
    NoteInput:
      type: object
      required: [title, decided_on, node_ids, body]
      properties:
        title: { type: string, maxLength: 200 }
        decided_on: { type: string, format: date }
        client_id: { type: integer, format: int64, description: Omitted for all clients. }
        attendees: { type: string, maxLength: 500 }
        node_ids:
          type: array
          description: One or more menus or modules of the project.
          items: { type: integer, format: int64 }
        ticket_keys:
          type: array
          description: Tickets the decision relates to, in any project the author can see.
          items: { type: string }
        body: { type: string, maxLength: 50000, description: Markdown; the form starts with Decision, Why and Alternatives rejected. }
    NoteUpdate:
      allOf:
        - $ref: "#/components/schemas/NoteInput"
        - type: object
          properties:
            archived: { type: boolean, description: Archive (true) or restore (false). }
    Note:
      type: object
      required: [id, key, project_key, title, decided_on, attendees, body, nodes, tickets, author, created_at, updated_at, archived, can_edit]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: HRIS-DN7 }
        project_key: { type: string }
        title: { type: string }
        decided_on: { type: string, format: date }
        client: { $ref: "#/components/schemas/Ref" }
        attendees: { type: string }
        body: { type: string }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/NodeRef" }
        tickets:
          type: array
          description: Linked tickets the reader can see.
          items: { $ref: "#/components/schemas/NoteTicket" }
        author: { $ref: "#/components/schemas/Ref" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived: { type: boolean }
        can_edit: { type: boolean, description: The reader is the author or a project admin. }
    NoteTicket:
      type: object
      required: [key, title]
      properties:
        key: { type: string }
        title: { type: string }
    NoteSummary:
      type: object
      required: [key, title, decided_on, archived]
      properties:
        key: { type: string }
        title: { type: string }
        decided_on: { type: string, format: date }
        client: { $ref: "#/components/schemas/Ref" }
        archived: { type: boolean }
    NoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteSummary" }
    APIToken:
      type: object
      required: [id, name, read_only, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        read_only: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    APITokenList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    APITokenCreate:
      type: object
      required: [name, read_only]
      properties:
        name: { type: string, maxLength: 100 }
        read_only: { type: boolean }
        expires_on: { type: string, format: date, description: The last day the token works; omitted for no expiry. }
    APITokenCreated:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: "The secret, e.g. msl_…; shown once." }
    NodeImportResult:
      type: object
      required: [applied, created, changed, unchanged, missing, problems]
      properties:
        applied: { type: boolean }
        created:
          type: array
          items: { $ref: "#/components/schemas/NodeImportRow" }
        changed:
          type: array
          items: { $ref: "#/components/schemas/NodeImportRow" }
        unchanged: { type: integer }
        missing:
          type: array
          description: Live nodes the file leaves out, for manual archiving.
          items: { type: string }
        problems:
          type: array
          items: { $ref: "#/components/schemas/NodeImportProblem" }
    NodeImportRow:
      type: object
      required: [line, path, type, fields]
      properties:
        line: { type: integer }
        path: { type: string, example: "HR › Attendance › Overtime Approval" }
        type: { $ref: "#/components/schemas/NodeType" }
        fields: { type: array, items: { type: string }, description: What changes, for a changed row. }
    NodeImportProblem:
      type: object
      required: [line, code, message]
      properties:
        line: { type: integer, description: 0 for the file as a whole. }
        code: { type: string, enum: [unreadable, empty, too_many_rows, unknown_shape, bad_client_scope, missing_id, duplicate_id, missing_parent, cycle, duplicate_name, duplicate_code, empty_name, bad_type, long_name, unknown_client, no_clients] }
        path: { type: string }
        message: { type: string }
    ImportMapping:
      type: object
      required: [columns]
      properties:
        columns:
          type: object
          description: Field → column header. Fields are key, title, description, reason, type, status, priority, client, created, resolved, reporter, assignee, components, labels, comments, attachments.
          additionalProperties: { type: string }
        types: { type: object, description: Source value (lower case) → bug, change_request or feature., additionalProperties: { type: string } }
        statuses: { type: object, description: Source value (lower case) → a project status name., additionalProperties: { type: string } }
        priorities: { type: object, description: Source value (lower case) → low, medium, high or urgent., additionalProperties: { type: string } }
        nodes: { type: object, description: Component or label (lower case) → node id; others match by name, alias or code., additionalProperties: { type: integer, format: int64 } }
    ImportStats:
      type: object
      required: [rows, create, update, reject, linked, coverage, done, tickets, comments]
      properties:
        rows: { type: integer }
        create: { type: integer }
        update: { type: integer }
        reject: { type: integer }
        linked: { type: integer }
        coverage: { type: integer, description: Percent of valid rows mapped to a menu. }
        done: { type: integer, description: Rows written so far. }
        tickets: { type: integer }
        comments: { type: integer }
    ImportProblem:
      type: object
      required: [line, message]
      properties:
        line: { type: integer }
        key: { type: string }
        message: { type: string }
    ImportRun:
      type: object
      required: [id, project_key, file_name, status, headers, mapping, stats, errors, created_by, created_at]
      properties:
        id: { type: integer, format: int64 }
        project_key: { type: string }
        file_name: { type: string }
        status: { type: string, enum: [uploaded, dry_run, running, done, failed] }
        headers: { type: array, items: { type: string } }
        mapping: { $ref: "#/components/schemas/ImportMapping" }
        stats: { $ref: "#/components/schemas/ImportStats" }
        errors: { type: array, items: { $ref: "#/components/schemas/ImportProblem" } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    ImportRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportRun" } }
    NotifyPrefs:
      type: object
      description: Each event on or off, and browser notifications (§8.10). An absent event is on; browser is off until chosen.
      properties:
        assigned: { type: boolean }
        comment: { type: boolean }
        mention: { type: boolean }
        status: { type: boolean }
        job_done: { type: boolean }
        browser: { type: boolean }
        email: { type: boolean, description: "Also by email, a digest of what is still unread after two minutes, when the server has SMTP set up (MSL-10). Off until chosen." }
    Notification:
      type: object
      required: [id, type, payload, created_at, read]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [assigned, comment, mention, status, job_done] }
        ticket_key: { type: string }
        ticket_title: { type: string }
        actor: { $ref: "#/components/schemas/Ref" }
        payload: { type: object, additionalProperties: true, description: "status: the new status name; comment: an excerpt; job_done: kind, name and link." }
        created_at: { type: string, format: date-time }
        read: { type: boolean }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        unread: { type: integer }
    Mentionable:
      type: object
      required: [id, name, handle]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        handle: { type: string, example: rina }
    MentionableList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Mentionable" } }
    RepoProvider:
      type: string
      enum: [github, gitlab, gitea]
    RepoInput:
      type: object
      required: [provider, name, web_url]
      properties:
        provider: { $ref: "#/components/schemas/RepoProvider" }
        name: { type: string, maxLength: 200 }
        web_url: { type: string, maxLength: 500 }
    RepoUpdate:
      type: object
      required: [name, web_url]
      properties:
        name: { type: string, maxLength: 200 }
        web_url: { type: string, maxLength: 500 }
        new_secret: { type: boolean }
    Repo:
      type: object
      required: [id, provider, name, web_url, webhook_url, created_at]
      properties:
        id: { type: integer, format: int64 }
        provider: { $ref: "#/components/schemas/RepoProvider" }
        name: { type: string }
        web_url: { type: string }
        webhook_url: { type: string, example: "https://muasal.example.com/webhooks/git/3" }
        secret: { type: string, description: Only when just created or replaced. }
        created_at: { type: string, format: date-time }
    RepoList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Repo" } }
    TicketCode:
      type: object
      required: [merge_requests, commits]
      properties:
        merge_requests: { type: array, items: { $ref: "#/components/schemas/CodeMergeRequest" } }
        commits: { type: array, items: { $ref: "#/components/schemas/CodeCommit" } }
    CodeMergeRequest:
      type: object
      required: [repo, number, title, state]
      properties:
        repo: { type: string }
        number: { type: integer }
        title: { type: string }
        state: { type: string }
        merged_at: { type: string, format: date-time, nullable: true }
        url: { type: string, nullable: true }
    CodeCommit:
      type: object
      required: [repo, sha, message]
      properties:
        repo: { type: string }
        sha: { type: string }
        message: { type: string, description: The first line. }
        author: { type: string, nullable: true }
        committed_at: { type: string, format: date-time, nullable: true }
        url: { type: string, nullable: true }
    SearchResults:
      type: object
      required: [tickets, nodes, notes, sections]
      properties:
        sections:
          type: array
          description: Document sections by words in their heading or text (MSL-15).
          items: { $ref: "#/components/schemas/SearchSection" }
        tickets:
          type: array
          items: { $ref: "#/components/schemas/SearchTicket" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/SearchNote" }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/SearchNode" }
    SearchSection:
      type: object
      required: [document_key, document_title, project_key, number, title, excerpt, superseded]
      properties:
        document_key: { type: string }
        document_title: { type: string }
        project_key: { type: string }
        number: { type: string, example: "3.2" }
        title: { type: string }
        excerpt: { type: string, description: Plain text around the first match. }
        superseded: { type: boolean, description: A newer document replaced this one. }
    SearchNote:
      type: object
      required: [key, title, project_key, decided_on]
      properties:
        key: { type: string }
        title: { type: string }
        project_key: { type: string }
        decided_on: { type: string, format: date }
    MyTicketsView:
      type: string
      enum: [all, overdue, week, incomplete]
      description: overdue is due before today and week due from today through 7 days ahead, today being the date in the user's timezone; incomplete lacks a reason or a menu.
    MyTicket:
      type: object
      required: [key, title, type, priority, status, missing_reason, missing_menus]
      properties:
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        priority: { $ref: "#/components/schemas/Priority" }
        due_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/Status" }
        client: { $ref: "#/components/schemas/Ref" }
        menu: { type: string, description: 'The first menu''s parent and name, e.g. "Payroll › Payslip".' }
        missing_reason: { type: boolean }
        missing_menus: { type: boolean }
    MyTicketsCounts:
      type: object
      required: [all, overdue, week, incomplete]
      properties:
        all: { type: integer }
        overdue: { type: integer }
        week: { type: integer }
        incomplete: { type: integer }
    AttentionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProjectAttention" } }
    ProjectAttention:
      type: object
      required: [key, name, overdue, week, unassigned, no_reason, weak_reason, no_menu, stale]
      properties:
        key: { type: string }
        name: { type: string }
        overdue: { type: integer }
        week: { type: integer, description: Due today or within the next 7 days. }
        unassigned: { type: integer }
        no_reason: { type: integer }
        weak_reason: { type: integer }
        no_menu: { type: integer }
        stale: { type: integer, description: Unchanged for 7 days or more. }
    ProjectCount:
      type: object
      required: [key, open]
      properties:
        key: { type: string }
        open: { type: integer }
    MyTicketsPage:
      type: object
      required: [items, next_cursor, counts, projects]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MyTicket" }
        next_cursor: { type: string, nullable: true }
        counts: { $ref: "#/components/schemas/MyTicketsCounts" }
        projects:
          type: array
          description: The caller's open tickets per project; projects without any are left out.
          items: { $ref: "#/components/schemas/ProjectCount" }
    RecentTicket:
      type: object
      required: [key, title, type, status, updated_at]
      properties:
        key: { type: string }
        title: { type: string }
        type: { $ref: "#/components/schemas/TicketType" }
        status: { $ref: "#/components/schemas/Status" }
        updated_at: { type: string, format: date-time }
        change: { $ref: "#/components/schemas/ActivityItem" }
    RecentTicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecentTicket" }
    AIMode:
      type: string
      enum: [off, local, byok]
    AIEndpoint:
      type: object
      required: [url, model, api_key_set]
      properties:
        url: { type: string, example: "http://model:11434/v1" }
        model: { type: string, example: "qwen3.5:4b" }
        api_key_set: { type: boolean }
    AIEndpointUpdate:
      type: object
      required: [url, model]
      properties:
        url: { type: string, maxLength: 500 }
        model: { type: string, maxLength: 200 }
        api_key: { type: string, maxLength: 500, description: Omitted keeps the saved key; an empty string removes it. }
    AITuning:
      type: object
      required: [context_tokens, max_concurrent, temperature, timeout_seconds, min_similarity, exhaustive_max]
      properties:
        context_tokens: { type: integer, description: Evidence budget in tokens. }
        max_concurrent: { type: integer, description: Answers generated at once. }
        temperature: { type: number, format: double }
        timeout_seconds: { type: integer }
        min_similarity: { type: number, format: double, description: Relevance floor for vector-only evidence. }
        exhaustive_max: { type: integer, description: At most this many matching items skip ranking. }
    AISettings:
      type: object
      required: [mode, provider, acknowledged, chat, embed, embed_dim, tuning, badge, secret_key_set]
      properties:
        mode: { $ref: "#/components/schemas/AIMode" }
        provider: { type: string, description: The BYOK provider's name. }
        acknowledged: { type: boolean, description: R-AI-1 }
        chat: { $ref: "#/components/schemas/AIEndpoint" }
        embed: { $ref: "#/components/schemas/AIEndpoint" }
        embed_dim: { type: integer }
        tuning: { $ref: "#/components/schemas/AITuning" }
        badge: { type: string, example: "Local · qwen3.5:4b" }
        secret_key_set: { type: boolean, description: Whether APP_SECRET_KEY is set, which API keys need. }
    AISettingsUpdate:
      type: object
      required: [mode, chat, embed, tuning]
      properties:
        mode: { $ref: "#/components/schemas/AIMode" }
        provider: { type: string, maxLength: 100 }
        acknowledged: { type: boolean }
        chat: { $ref: "#/components/schemas/AIEndpointUpdate" }
        embed: { $ref: "#/components/schemas/AIEndpointUpdate" }
        tuning: { $ref: "#/components/schemas/AITuning" }
        embed_dim: { type: integer, minimum: 1, maximum: 4000, description: The new embedding model's dimension, from Test connection; omitted keeps the current one. }
        reindex:
          type: boolean
          description: >-
            Confirms that a new embedding model re-embeds every chunk (§13.4). Changing the embedding URL, model or
            dimension without it answers 422 reindex_required.
    AIProbe:
      type: object
      required: [ok, latency_ms]
      properties:
        ok: { type: boolean }
        latency_ms: { type: integer }
        error: { type: string }
        reason:
          type: string
          enum: [unknown_host, refused, timeout, tls, unauthorized, not_found, no_model]
          description: The failure's likely cause, which the page says in plain words above the raw error (MSL-31).
        models:
          type: array
          items: { type: string }
        dim: { type: integer, description: The embedding's dimension. }
    AITestResult:
      type: object
      required: [chat, embed]
      properties:
        chat: { $ref: "#/components/schemas/AIProbe" }
        embed: { $ref: "#/components/schemas/AIProbe" }
    ModelChunks:
      type: object
      required: [model, chunks]
      properties:
        model: { type: string, description: Empty for chunks without a vector. }
        chunks: { type: integer, format: int64 }
    FailedJob:
      type: object
      required: [id, ticket_id, attempts, error, at]
      properties:
        id: { type: integer, format: int64 }
        ticket_id: { type: integer, format: int64 }
        attempts: { type: integer }
        error: { type: string }
        at: { type: string, format: date-time }
    IndexStatus:
      type: object
      required: [mode, embed_model, total_chunks, pending_chunks, chunks_by_model, queued_jobs, failed_jobs]
      properties:
        mode: { $ref: "#/components/schemas/AIMode" }
        embed_model: { type: string }
        total_chunks: { type: integer, format: int64 }
        pending_chunks: { type: integer, format: int64, description: Chunks without a vector from the current embedding model. }
        chunks_by_model:
          type: array
          items: { $ref: "#/components/schemas/ModelChunks" }
        queued_jobs: { type: integer, format: int64, description: Index jobs waiting or retrying. }
        failed_jobs:
          type: array
          description: Index jobs that used up their 10 attempts, newest first, at most 50.
          items: { $ref: "#/components/schemas/FailedJob" }
        last_indexed_at: { type: string, format: date-time, nullable: true }
    ReindexRequest:
      type: object
      required: [scope]
      properties:
        scope: { type: string, enum: [all, failed] }
    ReindexResult:
      type: object
      required: [queued]
      properties:
        queued: { type: integer }
    AskScope:
      type: object
      description: Chips; an empty list means no filter. Dates are whole days in the asker's timezone.
      properties:
        project_ids: { type: array, items: { type: integer, format: int64 } }
        node_ids: { type: array, items: { type: integer, format: int64 }, description: Sub-nodes are included. }
        client_ids: { type: array, items: { type: integer, format: int64 }, description: Core work (all clients) is included. }
        user_ids: { type: array, items: { type: integer, format: int64 } }
        contact_ids: { type: array, items: { type: integer, format: int64 } }
        from: { type: string, format: date }
        to: { type: string, format: date }
    AskDetected:
      allOf:
        - $ref: "#/components/schemas/AskScope"
        - type: object
          properties:
            keys: { type: array, items: { type: string }, description: Ticket keys named in the question. }
            labels: { type: array, items: { $ref: "#/components/schemas/AskLabel" }, description: Names for the detected clients, nodes and people. }
    AskLabel:
      type: object
      required: [kind, id, label]
      properties:
        kind: { type: string, enum: [client, node, user, contact] }
        id: { type: integer, format: int64 }
        label: { type: string, description: A node's label is its path, e.g. "HR › Overtime Approval". }
    AskScopeEvent:
      type: object
      required: [explicit, detected]
      properties:
        explicit: { $ref: "#/components/schemas/AskScope" }
        detected: { $ref: "#/components/schemas/AskDetected" }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        thread_id: { type: integer, format: int64, description: Adds the question to one of the asker's threads. }
        language: { type: string, enum: [auto, id, en], default: auto }
        scope: { $ref: "#/components/schemas/AskScope" }
        ignore:
          type: array
          description: Detected chips the asker removed; detection leaves them out (§10.2). A date entry drops the detected range.
          items: { $ref: "#/components/schemas/AskIgnore" }
    AskIgnore:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [client, node, user, contact, date] }
        id: { type: integer, format: int64 }
    AskItem:
      type: object
      required: [kind, key, title, client, requested_by, date, status, closed]
      properties:
        kind: { type: string, enum: [ticket, note, document], description: A ticket, a decision note such as HRIS-DN7 (FSD §9.4), or a document section such as HRIS-DOC1/7.4 (§7.7). }
        key: { type: string }
        title: { type: string }
        client: { type: string, nullable: true, description: Null for core work. }
        requested_by: { type: string, description: A note's author. }
        date: { type: string, format: date-time, description: The close date, or the creation date while open; a note's decision date. }
        status: { type: string }
        closed: { type: boolean }
    AskClaim:
      type: object
      required: [text, cites]
      properties:
        text: { type: string }
        cites: { type: array, items: { type: string } }
    AskResult:
      type: object
      required: [status, query_id, thread_id, language, scope, evidence, claims, closest, results]
      properties:
        status: { type: string, enum: [answered, not_enough_info, ai_off, error] }
        query_id: { type: integer, format: int64 }
        thread_id: { type: integer, format: int64 }
        language: { type: string, enum: [id, en] }
        model: { type: string, description: The badge, e.g. "Local · qwen3.5:4b" or "Cloud · <provider> · <model>". }
        message: { type: string, description: The not-enough-information text, or the error's message. }
        error_code: { type: string, enum: [ai_unavailable, ai_busy, ai_timeout, ai_invalid] }
        scope: { $ref: "#/components/schemas/AskScopeEvent" }
        evidence: { type: array, items: { $ref: "#/components/schemas/AskItem" } }
        claims: { type: array, items: { $ref: "#/components/schemas/AskClaim" } }
        closest: { type: array, items: { $ref: "#/components/schemas/AskItem" }, description: With not enough information, up to five nearest tickets. }
        results: { type: array, items: { $ref: "#/components/schemas/AskItem" }, description: With AI off, the keyword results. }
    AskFeedback:
      type: object
      required: [rating]
      properties:
        rating: { type: string, enum: [up, down] }
        reasons:
          type: array
          description: With down.
          items: { type: string, enum: [wrong, missing_tickets, wrong_citation, too_vague] }
        comment: { type: string, maxLength: 1000 }
    AskThread:
      type: object
      required: [id, title, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        created_at: { type: string, format: date-time }
    AskThreadList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AskThread" } }
    AskThreadQuery:
      type: object
      required: [id, question, status, claims, created_at]
      properties:
        id: { type: integer, format: int64 }
        question: { type: string }
        status: { type: string }
        claims: { type: array, items: { $ref: "#/components/schemas/AskClaim" } }
        model: { type: string }
        created_at: { type: string, format: date-time }
        evidence: { type: array, items: { $ref: "#/components/schemas/AskItem" }, description: The evidence the asker may still open. }
        feedback: { $ref: "#/components/schemas/AskFeedback" }
    AskThreadDetail:
      allOf:
        - $ref: "#/components/schemas/AskThread"
        - type: object
          required: [queries]
          properties:
            queries: { type: array, items: { $ref: "#/components/schemas/AskThreadQuery" } }
    AskLogEntry:
      type: object
      required: [id, created_at, user, question, status, llm_called, evidence_count, citations]
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/Ref" }
        question: { type: string }
        status: { type: string, enum: [answered, not_enough_info, ai_off, error] }
        llm_called: { type: boolean }
        latency_ms: { type: integer }
        model: { type: string }
        evidence_count: { type: integer }
        citations: { type: integer, description: Distinct tickets and notes cited by the answer. }
        feedback: { $ref: "#/components/schemas/AskFeedback" }
    AskLogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AskLogEntry" } }
        next_before: { type: integer, format: int64, description: Pass as before for the next page; absent on the last. }
    AskLogEvidence:
      allOf:
        - $ref: "#/components/schemas/AskItem"
        - type: object
          properties:
            score: { type: number, description: Fused retrieval score; absent on the small-set path. }
    AskLogDetail:
      allOf:
        - $ref: "#/components/schemas/AskLogEntry"
        - type: object
          required: [language, scope, evidence, claims]
          properties:
            thread_id: { type: integer, format: int64 }
            language: { type: string }
            first_claim_ms: { type: integer }
            scope: { type: object, additionalProperties: true, description: The explicit and detected chips as logged. }
            evidence: { type: array, items: { $ref: "#/components/schemas/AskLogEvidence" } }
            claims: { type: array, items: { $ref: "#/components/schemas/AskClaim" } }
            dropped: { type: object, additionalProperties: true, description: Claims and citations removed by validation, and any model error. }
    AuditEvent:
      type: object
      required: [id, occurred_at, via, entity, entity_id, action, changes]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Ref" }
        via: { type: string }
        token: { type: string, description: The name of the API token the action came through (MSL-27). }
        entity: { type: string }
        entity_id: { type: integer, format: int64 }
        subject: { type: string, description: "The entity as people know it: a ticket, note or document key, a project key, or a name (MSL-27)." }
        project: { type: string, description: The project key, when the event belongs to one. }
        action: { type: string }
        changes: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_before: { type: integer, format: int64 }
    Backup:
      type: object
      required: [file, size_bytes, created_at]
      properties:
        file: { type: string, example: db-20260926-0100.dump }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    BackupList:
      type: object
      required: [location, requested, same_disk, items]
      properties:
        location: { type: string, description: Where the backups live on the server. }
        same_disk:
          type: boolean
          description: The backups sit on the same disk as the attachments (on a default install, also the database), so one disk failure loses both (MSL-40).
        requested: { type: boolean, description: A "Run backup now" is waiting for the backup service. }
        items: { type: array, items: { $ref: "#/components/schemas/Backup" } }
    SystemStatus:
      type: object
      required: [database_bytes, jobs, model, email, disks, warnings]
      properties:
        email:
          type: object
          description: Email notifications (MSL-10), set up by SMTP_HOST and friends in deploy/.env.
          required: [enabled]
          properties:
            enabled: { type: boolean }
            host: { type: string }
        database_bytes: { type: integer, format: int64 }
        jobs:
          type: object
          description: River jobs by state (available, scheduled, running, retryable, discarded).
          additionalProperties: { type: integer, format: int64 }
        model:
          type: object
          required: [mode]
          properties:
            mode: { $ref: "#/components/schemas/AIMode" }
            reachable: { type: boolean, description: Absent when AI is off. }
            error: { type: string }
        disks: { type: array, items: { $ref: "#/components/schemas/DiskUse" } }
        warnings:
          type: array
          items: { type: string, enum: [disk_attachments, disk_backups, model_unreachable, jobs_failed] }
    DiskUse:
      type: object
      required: [volume, path, used_bytes, total_bytes]
      properties:
        volume: { type: string, enum: [attachments, backups] }
        path: { type: string }
        used_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        missing: { type: boolean, description: The folder does not exist on this server. }
    RecentNodes:
      type: object
      required: [node_ids]
      properties:
        node_ids:
          type: array
          items: { type: integer, format: int64 }
