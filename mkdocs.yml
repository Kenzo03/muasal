site_name: Zettra
site_description: "The why behind every screen: self-hosted ticketing that records the reason for every change."
site_url: https://zettra.dev/
repo_url: https://github.com/Kenzo03/zettra
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
theme:
  name: material
  logo: images/logo.svg # the app's icon (web/app/icon.svg)
  favicon: images/logo.svg
  features:
    - navigation.sections
    - content.code.copy
    - search.highlight
  palette:
    primary: custom # docs/stylesheets/extra.css
    accent: custom
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list # buttons on the home page
  - md_in_html # the home page's feature cards
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Hardware guide: hardware.md
  - Running Zettra: operations.md
  - User guide: user-guide.md
  - MCP for AI agents: mcp.md
  - Pilot kit: pilot.md
  - Security review: security/asvs-l1.md
