name: zettra
services:
  caddy:
    image: caddy:2
    # Caddy listens on the port in PUBLIC_URL, so the container port matches the host port.
    ports: ["${HTTP_PORT:-80}:${HTTP_PORT:-80}"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on: [web, app]
    networks: [edge, app]
    restart: unless-stopped

  web:
    build: ../web
    image: ${IMAGE_PREFIX:-zettra}-web:${VERSION:-dev}
    environment:
      API_INTERNAL_URL: http://app:8080
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [app]
    restart: unless-stopped

  app:
    build: ../server
    image: ${IMAGE_PREFIX:-zettra}-app:${VERSION:-dev}
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://app:${DB_APP_PASSWORD}@db:5432/zettra?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://owner:${DB_OWNER_PASSWORD}@db:5432/zettra?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-} # seals AI API keys (BYOK); `openssl rand -base64 32`
      ASK_LOG_RETENTION_DAYS: ${ASK_LOG_RETENTION_DAYS:-365} # 0 keeps the Ask log for good
      # Email notifications: off without SMTP_HOST (docs/operations.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes: [attachments:/data/attachments, backups:/backups]
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      retries: 30
    depends_on:
      db: { condition: service_healthy }
    networks: [app]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    # Memory by tier (FSD §16, §18.1): install.sh writes 4GB and 16GB for the
    # 32 GB server tiers; the defaults suit a laptop. JIT is off: it spends
    # more compiling short queries than it saves.
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}", "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}", "-c", "jit=off"]
    environment:
      POSTGRES_DB: zettra
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "owner", "-d", "zettra"]
      interval: 5s
      retries: 20
    networks: [app]
    restart: unless-stopped

  # Daily database dumps and attachment copies into the backups volume (FSD §19.4).
  backup:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      TZ: ${TZ:-Asia/Jakarta}
      BACKUP_INCLUDE_VECTORS: ${BACKUP_INCLUDE_VECTORS:-false}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
      - attachments:/data/attachments:ro
    depends_on:
      db: { condition: service_healthy }
    networks: [app]
    restart: unless-stopped

  # Optional local model server (FSD §3, §13.4): `docker compose --profile local-ai up -d`.
  # It sits on the internal network, so models come from the offline bundle or a
  # one-off pull (see the README); on macOS run Ollama natively instead, with
  # compose.host-ai.yaml, so it can use the Apple GPU (§18.1).
  model:
    image: ollama/ollama:0.34.1
    profiles: [local-ai]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes: [models:/root/.ollama]
    networks: [app]
    restart: unless-stopped

networks:
  edge: {}
  app: { internal: true } # no route to the internet

volumes:
  caddy_data: {}
  pgdata: {}
  attachments: {}
  backups: {}
  models: {}
